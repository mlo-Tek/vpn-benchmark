services:
  vpn-benchmark:
    image: ghcr.io/mlo-tek/vpn-benchmark:latest
    container_name: vpn-benchmark
    init: true
    restart: unless-stopped
    ports:
      # Secure default: reachable on the Docker host only (use an SSH tunnel).
      - "${VPN_BENCHMARK_BIND:-127.0.0.1}:${VPN_BENCHMARK_PORT:-8765}:8080"
    cap_add:
      # Required for WireGuard interfaces and isolated network/mount namespaces.
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      IGNORE_IPV6: "1"
      VPN_BENCHMARK_USER: ${VPN_BENCHMARK_USER:-}
      VPN_BENCHMARK_PASSWORD: ${VPN_BENCHMARK_PASSWORD:-}
    volumes:
      - ./configs:/configs:rw
      - ./data:/data:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
