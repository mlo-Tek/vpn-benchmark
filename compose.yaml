services:
  vpn-benchmark:
    image: ghcr.io/mlo-tek/vpn-benchmark:latest
    container_name: vpn-benchmark
    hostname: vpn-benchmark
    ports:
      - "8765:8080/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - PUID=99
      - PGID=100
      - UMASK=002
      - TZ=Europe/Berlin
    volumes:
      - /mnt/cache/appdata/vpn-benchmark/configs:/configs:ro
      - /mnt/cache/appdata/vpn-benchmark/data:/data:rw
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/wireguard.png
      net.unraid.docker.webui: http://192.168.1.6:8765
    restart: unless-stopped
