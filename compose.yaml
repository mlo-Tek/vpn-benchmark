services:
  vpn-benchmark:
    image: ghcr.io/mlo-tek/vpn-benchmark:latest
    container_name: vpn-benchmark
    hostname: vpn-benchmark
    ports:
      - "192.168.1.6:8765:8080/tcp"   # nur IPv4 (kein IPv6)
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - PUID=99
      - PGID=100
      - UMASK=002
      - TZ=Europe/Berlin
      - GITHUB_TOKEN=               # optional: fine-grained, read-only Contents (für den Update-Check)
    volumes:
      - /mnt/cache/appdata/vpn-benchmark/configs:/configs:rw             # geändert: war ro (Upload aus der Oberfläche)
      - /mnt/cache/appdata/vpn-benchmark/data:/data:rw
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/wireguard.png
      net.unraid.docker.webui: http://192.168.1.6:8765
    restart: unless-stopped
