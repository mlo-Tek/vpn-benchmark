<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPN Benchmark</title>
<style>
  :root { --bg:#fff; --fg:#1c1e21; --muted:#6b7280; --line:#e5e7eb; --card:#f7f8fa; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e6e8eb; --muted:#9aa1ab; --line:#2a2e35; --card:#1b1e23; --accent:#5b8def; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:14px/1.45 system-ui, sans-serif; max-width:1200px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 12px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  select, input, button { font:inherit; padding:6px 10px; border:1px solid var(--line);
         border-radius:6px; background:var(--card); color:var(--fg); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child, td.l, th.l { text-align:left; }
  th { cursor:pointer; color:var(--muted); font-weight:600; }
  .scroll { overflow-x:auto; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px; }
  pre { margin:0; max-height:140px; overflow:auto; font-size:12px; }
  details summary { cursor:pointer; color:var(--muted); }
  .err { color:#dc2626; }
</style>
</head>
<body>
<h1>VPN Benchmark</h1>

<div class="bar">
  <select id="mode">
    <option value="standard">Standard (Peering + Top-N Durchsatz)</option>
    <option value="peering">Nur Peering (schnell)</option>
    <option value="full">Alles voll (Durchsatz für alle)</option>
  </select>
  <label>Parallel <input id="parallel" type="number" value="8" min="1" max="32" style="width:60px"></label>
  <label>Top-N <input id="topn" type="number" value="10" min="1" style="width:60px"></label>
  <button class="primary" id="start">Test starten</button>
  <span id="cfgcount" class="muted"></span>
</div>
<div class="bar" id="providers"></div>

<div class="card" id="progress" hidden>
  <div id="phase"></div>
  <div id="items" class="muted"></div>
  <details><summary>Log</summary><pre id="log"></pre></details>
</div>

<div class="bar">
  <select id="runs"></select>
  <a id="csv" href="#">CSV</a>
  <span id="baseline" class="muted"></span>
</div>

<div class="scroll"><table id="tbl"></table></div>

<details class="card" style="margin-top:16px">
  <summary>Länder-Gewichte (Peer-Anteil)</summary>
  <div id="weights" class="bar" style="margin-top:8px"></div>
  <button id="saveW">Speichern</button>
  <span class="muted">Hohe Gewichte für Länder, in denen viele deiner Peers sitzen.</span>
</details>

<script>
const $ = id => document.getElementById(id);
let sortKey = "score", sortDir = -1, current = null, countries = [];

const api = (u, o) => fetch(u, o).then(r => r.json());
const fmt = (v, d = 0) => v == null ? "–" : Number(v).toFixed(d);

function cellColor(rtt) {
  if (rtt == null) return "";
  const t = Math.max(0, Math.min(1, (rtt - 10) / 90));      // 10ms green .. 100ms red
  return `background:hsl(${120 - 120 * t} 55% 45% / .28)`;
}

function render() {
  if (!current) return;
  const rs = current.results.slice();
  countries = [...new Set(rs.flatMap(r => Object.keys(r.matrix || {})))].sort();
  const val = r => ({
    name: r.name, score: r.score.total, dl: r.throughput?.dl.mbps, ul: r.throughput?.ul.mbps,
    swarm: r.swarm?.success, hs: r.handshake_s
  }[sortKey] ?? r.matrix?.[sortKey]?.median ?? -1);
  rs.sort((a, b) => (val(a) > val(b) ? 1 : -1) * sortDir);
  const base = current.baseline?.matrix || {};
  const th = (k, t) => `<th data-k="${k}">${t}</th>`;
  let h = "<tr>" + th("name", "Config") + th("score", "Score") + `<th class="l">Exit</th>` +
    countries.map(c => th(c, c + " ms")).join("") +
    th("swarm", "Swarm") + th("hs", "HS s") + th("dl", "↓ Mbit/s") + th("ul", "↑ Mbit/s") + "</tr>";
  if (Object.keys(base).length)
    h += `<tr class="muted"><td>Baseline (ohne VPN)</td><td></td><td></td>` +
      countries.map(c => `<td>${fmt(base[c]?.median)}</td>`).join("") + "<td></td><td></td><td></td><td></td></tr>";
  for (const r of rs) {
    if (r.error) { h += `<tr><td>${r.name}</td><td colspan="${countries.length + 7}" class="err l">${r.error}</td></tr>`; continue; }
    const e = r.exit || {};
    h += `<tr><td title="${r.score.peering}/${r.score.swarm}/${r.score.reliability}"><b>${r.name}</b></td>` +
      `<td><b>${fmt(r.score.total, 1)}</b></td><td class="l muted">${e.country || ""} ${e.city || ""}</td>` +
      countries.map(c => { const m = r.matrix?.[c];
        return `<td style="${cellColor(m?.median)}" title="Loss ${fmt((m?.loss || 0) * 100)}%">${fmt(m?.median)}</td>`; }).join("") +
      `<td>${r.swarm ? fmt(r.swarm.success * 100) + "%" : "–"}</td><td>${fmt(r.handshake_s, 1)}</td>` +
      `<td>${fmt(r.throughput?.dl.mbps)}</td><td>${fmt(r.throughput?.ul.mbps)}</td></tr>`;
  }
  $("tbl").innerHTML = h;
  $("tbl").querySelectorAll("th").forEach(t => t.onclick = () => {
    sortDir = sortKey === t.dataset.k ? -sortDir : -1; sortKey = t.dataset.k; render(); });
  const b = current.baseline;
  $("baseline").textContent = b?.dl ? `Baseline: ↓ ${fmt(b.dl.mbps)} / ↑ ${fmt(b.ul.mbps)} Mbit/s` : "";
  $("csv").href = `/api/runs/${current.id}/csv`;
}

async function loadRun(id) { current = await api(`/api/runs/${id}`); render(); }

async function refreshRuns(select) {
  const runs = await api("/api/runs");
  $("runs").innerHTML = runs.map(r =>
    `<option value="${r.id}">#${r.id} – ${new Date(r.started * 1000).toLocaleString()} – ${r.mode} (${r.status})</option>`).join("");
  if (runs.length) { if (select) $("runs").value = runs[0].id; loadRun($("runs").value); }
}

async function poll() {
  const s = await api("/api/status");
  $("start").disabled = s.running;
  $("progress").hidden = !s.running && !s.log.length;
  $("phase").textContent = s.running ? `Läuft – Phase: ${s.phase}` : "Idle";
  $("items").textContent = Object.entries(s.items).map(([k, v]) => `${k}: ${v.status}`).join(" · ");
  $("log").textContent = s.log.join("\n");
  if (s.running && s.run_id) loadRun(s.run_id).catch(() => {});
  if (poll.was && !s.running) refreshRuns(true);
  poll.was = s.running;
}

$("start").onclick = async () => {
  await api("/api/run", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: $("mode").value, parallel: +$("parallel").value, topn: +$("topn").value,
      providers: [...document.querySelectorAll('#providers input:checked')].map(i => i.value) }) });
  poll();
};
$("runs").onchange = e => loadRun(e.target.value);

async function initWeights() {
  const w = (await api("/api/settings")).weights;
  $("weights").innerHTML = Object.entries(w).map(([c, v]) =>
    `<label>${c} <input data-c="${c}" type="number" step="0.5" min="0" value="${v}" style="width:60px"></label>`).join("");
  $("saveW").onclick = async () => {
    const weights = {};
    $("weights").querySelectorAll("input").forEach(i => weights[i.dataset.c] = +i.value);
    await api("/api/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ weights }) });
    if (current) loadRun(current.id);
  };
}

api("/api/configs").then(c => {
  $("cfgcount").textContent = `${c.length} Configs in /configs`;
  const n = {}; c.forEach(x => n[x.provider] = (n[x.provider] || 0) + 1);
  $("providers").innerHTML = Object.entries(n).sort().map(([p, k]) =>
    `<label><input type="checkbox" value="${p}" checked> ${p} (${k})</label>`).join(" ");
});
initWeights(); refreshRuns(); poll(); setInterval(poll, 2000);
</script>
</body>
</html>
